<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="gold">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5" />
<meta name="theme-color" content="#0b0b16" />
<meta name="description" content="THE 1,000 HOURS OF WISDOM™ — a premium spiritual growth, prayer tracking and wisdom development platform." />
<meta name="color-scheme" content="dark light" />
<title>THE 1,000 HOURS OF WISDOM™</title>
<style>
/* ============================================================================
   THE 1,000 HOURS OF WISDOM™  ·  Design System
   Tokens → Base → Layout → Components → Views → Motion → Responsive → A11y
   ============================================================================ */

/* ---------- 1. TOKENS ---------- */
:root{
  --bg-0:#07070f; --bg-1:#0b0b16; --bg-2:#12121f;
  --grad-1:#141026; --grad-2:#0a0a14; --grad-3:#1a1330;
  --surface:rgba(255,255,255,.045); --surface-2:rgba(255,255,255,.07); --surface-3:rgba(255,255,255,.10);
  --border:rgba(255,255,255,.09); --border-2:rgba(255,255,255,.16);
  --text-0:#f6f3ff; --text-1:#cfc9e6; --text-2:#9a94b8; --text-3:#6d6790;
  --gold:#e8c98a; --gold-2:#c9a45c; --gold-soft:rgba(232,201,138,.14);
  --amethyst:#a98bff; --amethyst-2:#7c5cff; --violet:#c6a6ff; --rose:#f0a6c8; --teal:#7fe3d0;
  --good:#8ee6b0; --warn:#f2c47b; --bad:#f08a9a;
  --ring-track:rgba(255,255,255,.08);
  --shadow:0 20px 60px -20px rgba(0,0,0,.7);
  --glow:0 0 50px -12px rgba(169,139,255,.35);
  --r:22px; --r-sm:14px; --r-lg:30px; --blur:22px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"SFMono-Regular",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.16,1,.3,1); --ease-2:cubic-bezier(.34,1.56,.64,1); --ease-io:cubic-bezier(.65,0,.35,1);
  --dur:.4s;
}
html[data-theme="light"]{
  --bg-0:#eae4f3; --bg-1:#f4f0fa; --bg-2:#fff;
  --grad-1:#e9e0fb; --grad-2:#f5f0ff; --grad-3:#ece4fa;
  --surface:rgba(255,255,255,.62); --surface-2:rgba(255,255,255,.82); --surface-3:rgba(255,255,255,.94);
  --border:rgba(60,40,110,.10); --border-2:rgba(60,40,110,.18);
  --text-0:#211838; --text-1:#3d3358; --text-2:#665c86; --text-3:#8b83a8;
  --ring-track:rgba(60,40,110,.12);
  --shadow:0 20px 50px -22px rgba(80,50,140,.35);
  --glow:0 0 46px -16px rgba(124,92,255,.35);
}
/* Accent palettes (shift the two accent stops used throughout) */
[data-accent="amethyst"]{--gold:#c3b0ff;--gold-2:#8f74ff;--gold-soft:rgba(140,110,255,.16);--amethyst:#7c5cff;--amethyst-2:#5a3fd0}
[data-accent="sapphire"]{--gold:#8fbaff;--gold-2:#4f86e6;--gold-soft:rgba(90,140,240,.16);--amethyst:#6ea8ff;--amethyst-2:#3f6fd0}
[data-accent="emerald"]{--gold:#8fe8bd;--gold-2:#39b47e;--gold-soft:rgba(70,200,140,.16);--amethyst:#54d1a0;--amethyst-2:#2f9e78}
[data-accent="rose"]{--gold:#f4b0cf;--gold-2:#e06a99;--gold-soft:rgba(240,120,170,.16);--amethyst:#f08ab6;--amethyst-2:#d05a90}
[data-accent="ember"]{--gold:#f6c079;--gold-2:#e0842c;--gold-soft:rgba(240,150,60,.16);--amethyst:#ff9d5c;--amethyst-2:#e06a2c}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{font-family:var(--sans);color:var(--text-1);background:var(--bg-0);overflow-x:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;line-height:1.55}

/* ---------- 2. AMBIENT BACKGROUND ---------- */
.bg{position:fixed;inset:0;z-index:-3;background:
  radial-gradient(1200px 800px at 12% -10%,var(--grad-1),transparent 60%),
  radial-gradient(1000px 700px at 100% 0%,var(--grad-3),transparent 55%),
  radial-gradient(1200px 900px at 50% 120%,var(--grad-1),transparent 60%),var(--bg-1)}
.aurora{position:fixed;inset:-20%;z-index:-2;pointer-events:none;filter:blur(60px);opacity:.55}
html[data-theme="light"] .aurora{opacity:.5;mix-blend-mode:multiply}
.aurora span{position:absolute;border-radius:50%;mix-blend-mode:screen;opacity:.5;animation:drift 22s var(--ease) infinite alternate}
.aurora .a1{width:46vw;height:46vw;left:-6vw;top:-8vw;background:radial-gradient(circle,rgba(124,92,255,.55),transparent 65%);animation-delay:-2s}
.aurora .a2{width:40vw;height:40vw;right:-8vw;top:2vw;background:radial-gradient(circle,var(--gold-soft),transparent 65%);animation-delay:-8s}
.aurora .a3{width:52vw;height:52vw;left:20vw;bottom:-18vw;background:radial-gradient(circle,rgba(240,166,200,.30),transparent 65%);animation-delay:-14s}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(4vw,3vh,0) scale(1.12)}100%{transform:translate3d(-3vw,-2vh,0) scale(1.05)}}
.stars{position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.5}
html[data-theme="light"] .stars{opacity:.16}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;box-shadow:0 0 6px #fff;animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:.9;transform:scale(1)}}
/* performance mode dims ambient */
body.perf .aurora,body.perf .stars{display:none}
body.perf .glass,body.perf .modal{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}

::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:20px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--text-3)}

/* skip link + focus visibility (A11y) */
.skip{position:fixed;left:-999px;top:10px;z-index:2000;padding:10px 16px;border-radius:10px;background:var(--gold);color:#1a1305;font-weight:700}
.skip:focus{left:12px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
button:focus-visible,.nav-item:focus-visible,.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- 3. LOADER ---------- */
#loader{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:radial-gradient(900px 700px at 50% 40%,var(--grad-3),var(--bg-0));transition:opacity .9s var(--ease),visibility .9s}
#loader.hide{opacity:0;visibility:hidden}
.l-mark{width:120px;height:120px;position:relative;display:grid;place-items:center}
.l-mark svg{width:100%;height:100%;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.l-core{position:absolute;font-family:var(--serif);font-size:34px;color:var(--gold);text-shadow:0 0 24px var(--gold-soft);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.7;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
.l-title{font-family:var(--serif);letter-spacing:.14em;font-size:15px;color:var(--text-1);text-transform:uppercase;opacity:0;animation:fadeUp 1s .3s var(--ease) forwards}
.l-sub{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--text-3);opacity:0;animation:fadeUp 1s .6s var(--ease) forwards}
.l-bar{width:220px;height:3px;border-radius:3px;background:var(--ring-track);overflow:hidden}
.l-bar i{display:block;height:100%;width:40%;border-radius:3px;background:linear-gradient(90deg,transparent,var(--gold),var(--amethyst),transparent);animation:load 1.6s var(--ease) infinite}
@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* ---------- 4. APP LAYOUT ---------- */
#app{display:none;min-height:100vh}
#app.ready{display:block;animation:appIn 1s var(--ease)}
@keyframes appIn{from{opacity:0}to{opacity:1}}
.shell{display:flex;min-height:100vh}
.sidebar{width:264px;flex:0 0 264px;padding:22px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:8px;border-right:1px solid var(--border);background:linear-gradient(180deg,var(--surface),transparent);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));z-index:60}
.brand{display:flex;align-items:center;gap:12px;padding:8px 10px 16px}
.brand-badge{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,var(--gold-soft),transparent);border:1px solid var(--border-2);color:var(--gold);font-family:var(--serif);font-size:22px;box-shadow:inset 0 0 20px var(--gold-soft)}
.brand-title{font-family:var(--serif);font-size:15px;line-height:1.15;color:var(--text-0);letter-spacing:.02em}
.brand-title small{display:block;font-family:var(--sans);font-size:9.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--text-3);margin-top:3px}
.nav{display:flex;flex-direction:column;gap:3px;overflow-y:auto;padding-right:4px;margin-right:-4px;flex:1}
.nav::-webkit-scrollbar{width:6px}
.nav-item{display:flex;align-items:center;gap:13px;padding:11px 13px;border-radius:13px;color:var(--text-2);cursor:pointer;font-size:14px;font-weight:500;border:1px solid transparent;transition:all .3s var(--ease);position:relative;white-space:nowrap;background:none;width:100%;text-align:left;font-family:inherit}
.nav-item .ic{width:20px;height:20px;flex:0 0 20px;opacity:.85;transition:.3s var(--ease)}
.nav-item:hover{color:var(--text-0);background:var(--surface);border-color:var(--border)}
.nav-item:hover .ic{transform:scale(1.1);opacity:1}
.nav-item.active{color:var(--text-0);background:linear-gradient(120deg,var(--gold-soft),var(--surface-2));border-color:var(--border-2);box-shadow:var(--shadow)}
.nav-item.active::before{content:"";position:absolute;left:-16px;top:50%;transform:translateY(-50%);width:4px;height:24px;border-radius:4px;background:linear-gradient(var(--gold),var(--amethyst));box-shadow:0 0 14px var(--gold)}
.nav-item.active .ic{color:var(--gold);opacity:1}
.nav-badge{margin-left:auto;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--gold-soft);color:var(--gold)}
.nav-foot{padding-top:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.mini-timer{display:none;align-items:center;gap:10px;padding:10px 12px;border-radius:13px;background:linear-gradient(120deg,rgba(124,92,255,.16),var(--surface));border:1px solid var(--border-2);cursor:pointer;width:100%;font-family:inherit}
.mini-timer.on{display:flex;animation:fadeUp .4s var(--ease)}
.mini-timer .dot{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 10px var(--good);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}
.mini-timer .t{font-variant-numeric:tabular-nums;font-weight:600;color:var(--text-0);font-size:14px}
.mini-timer small{color:var(--text-3);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.lvl-chip{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:13px;background:var(--surface);border:1px solid var(--border);cursor:pointer;width:100%;font-family:inherit;text-align:left}
.lvl-chip:hover{border-color:var(--border-2);background:var(--surface-2)}
.lvl-chip .lv{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;font-family:var(--serif);font-weight:700;color:#1a1305;background:linear-gradient(135deg,var(--gold),var(--gold-2));font-size:15px}
.lvl-chip .meta{flex:1;min-width:0}
.lvl-chip .meta b{color:var(--text-0);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl-chip .xpbar{height:5px;border-radius:5px;background:var(--ring-track);margin-top:4px;overflow:hidden}
.lvl-chip .xpbar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--gold),var(--amethyst));transition:width 1s var(--ease)}

.main{flex:1;min-width:0;display:flex;flex-direction:column;transition:margin-left .38s var(--ease)}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;padding:14px 26px;background:linear-gradient(180deg,rgba(11,11,22,.72),transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
html[data-theme="light"] .topbar{background:linear-gradient(180deg,rgba(244,240,250,.78),transparent)}
.hamburger{display:grid;width:42px;height:42px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text-0);cursor:pointer;place-items:center}
.page-head{flex:1;min-width:0}
.page-head h1{margin:0;font-family:var(--serif);font-size:23px;font-weight:600;color:var(--text-0);letter-spacing:.01em;line-height:1.1}
.page-head p{margin:2px 0 0;font-size:12.5px;color:var(--text-3);letter-spacing:.02em}
.top-actions{display:flex;align-items:center;gap:9px}
.icon-btn{width:42px;height:42px;border-radius:13px;border:1px solid var(--border);background:var(--surface);color:var(--text-1);cursor:pointer;display:grid;place-items:center;transition:all .3s var(--ease)}
.icon-btn:hover{color:var(--text-0);border-color:var(--border-2);background:var(--surface-2);transform:translateY(-2px)}
.icon-btn svg{width:19px;height:19px}
.icon-btn.pulse::after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:var(--gold);top:8px;right:8px;box-shadow:0 0 8px var(--gold)}
.view-wrap{padding:8px 26px 130px;max-width:1300px;width:100%;margin:0 auto}

/* collapse (desktop) */
@media(min-width:861px){
  body.nav-collapsed .sidebar{position:fixed;left:0;top:0;bottom:0;width:82px;z-index:70;overflow:hidden;transition:width .38s var(--ease),box-shadow .38s var(--ease)}
  body.nav-collapsed .main{margin-left:82px}
  body.nav-collapsed .sidebar .brand{justify-content:center;padding-left:0;padding-right:0}
  body.nav-collapsed .sidebar .brand-title,body.nav-collapsed .nav-item span,body.nav-collapsed .nav-badge,body.nav-collapsed .mini-timer>div,body.nav-collapsed .lvl-chip .meta{opacity:0;white-space:nowrap;transition:opacity .2s}
  body.nav-collapsed .sidebar:not(:hover) .nav-item{justify-content:center}
  body.nav-collapsed .sidebar:not(:hover) .nav-item.active::before{display:none}
  body.nav-collapsed .sidebar:hover{width:264px;box-shadow:var(--shadow);background:linear-gradient(180deg,var(--surface-3),var(--surface));backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
  body.nav-collapsed .sidebar:hover .brand{justify-content:flex-start}
  body.nav-collapsed .sidebar:hover .brand-title,body.nav-collapsed .sidebar:hover .nav-item span,body.nav-collapsed .sidebar:hover .nav-badge,body.nav-collapsed .sidebar:hover .mini-timer>div,body.nav-collapsed .sidebar:hover .lvl-chip .meta{opacity:1}
}

/* ---------- 5. VIEWS / MOTION ---------- */
.view{display:none}
.view.active{display:block;animation:viewIn .55s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.reveal{opacity:0;transform:translateY(16px)}
.reveal.in{opacity:1;transform:none;transition:opacity .6s var(--ease),transform .6s var(--ease)}
.section-title{font-family:var(--serif);font-size:19px;color:var(--text-0);margin:34px 0 16px;display:flex;align-items:center;gap:11px}
.section-title:first-child{margin-top:6px}
.section-title .ic{color:var(--gold);width:20px;height:20px}
.section-title small{font-family:var(--sans);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);margin-left:auto}

/* ---------- 6. GLASS / CARDS ---------- */
.glass{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));box-shadow:var(--shadow);position:relative;overflow:hidden}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(160deg,rgba(255,255,255,.10),transparent 40%);pointer-events:none;opacity:.7}
.pad{padding:22px}
.lift{transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.lift:hover{transform:translateY(-4px);border-color:var(--border-2);box-shadow:0 30px 70px -24px rgba(0,0,0,.7),var(--glow)}
.grid{display:grid;gap:16px}
.g-hero{grid-template-columns:1.15fr .85fr}
.s4{grid-template-columns:repeat(4,1fr)} .s3{grid-template-columns:repeat(3,1fr)} .two{grid-template-columns:1fr 1fr}

.stat{padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);position:relative;overflow:hidden;transition:transform var(--dur) var(--ease),border-color var(--dur)}
.stat:hover{transform:translateY(-3px);border-color:var(--border-2)}
.stat .lbl{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--text-3);display:flex;align-items:center;gap:7px}
.stat .val{font-family:var(--serif);font-size:33px;color:var(--text-0);margin-top:8px;font-variant-numeric:tabular-nums;line-height:1}
.stat .val .u{font-size:14px;color:var(--text-3);font-family:var(--sans);margin-left:4px}
.stat .sub{font-size:12px;color:var(--text-2);margin-top:6px}
.trend{font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;display:inline-flex;gap:3px;align-items:center}
.trend.up{background:rgba(142,230,176,.15);color:var(--good)} .trend.down{background:rgba(240,138,154,.15);color:var(--bad)} .trend.flat{background:var(--surface-2);color:var(--text-2)}

/* rings */
.ring{position:relative;display:inline-grid;place-items:center}
.ring svg{transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .pct{font-family:var(--serif);font-size:46px;color:var(--text-0);line-height:1;font-variant-numeric:tabular-nums}
.ring .pct em{font-size:20px;color:var(--gold);font-style:normal}
.ring .lab{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-3);margin-top:8px}
.ring .hrs{font-size:13px;color:var(--text-2);margin-top:3px}

.pbar{height:16px;border-radius:20px;background:var(--ring-track);overflow:hidden;position:relative;border:1px solid var(--border)}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:20px;background:linear-gradient(90deg,var(--gold-2),var(--gold),var(--amethyst),var(--violet));background-size:200% 100%;animation:shimmer 4s linear infinite;transition:width 1.4s var(--ease);box-shadow:0 0 22px var(--gold-soft)}
@keyframes shimmer{to{background-position:200% 0}}
.pbar .glow{position:absolute;top:0;bottom:0;width:60px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:sweep 3s var(--ease) infinite}
@keyframes sweep{0%{left:-60px}100%{left:110%}}
.pbar.sm{height:9px}

.countdown{display:flex;gap:12px;flex-wrap:wrap}
.cd{flex:1;min-width:62px;text-align:center;padding:14px 8px;border-radius:16px;background:var(--surface-2);border:1px solid var(--border)}
.cd b{display:block;font-family:var(--serif);font-size:30px;color:var(--text-0);font-variant-numeric:tabular-nums;line-height:1}
.cd span{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);margin-top:6px;display:block}

/* scenario forecast */
.scenarios{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.scn{padding:14px;border-radius:16px;background:var(--surface-2);border:1px solid var(--border);text-align:center;transition:.3s var(--ease)}
.scn:hover{transform:translateY(-2px);border-color:var(--border-2)}
.scn .k{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}
.scn .d{font-family:var(--serif);font-size:16px;color:var(--text-0);margin:6px 0 4px}
.scn .c{font-size:11px;color:var(--text-2)}
.scn.best .d{color:var(--good)} .scn.worst .d{color:var(--warn)} .scn.exp{background:linear-gradient(120deg,var(--gold-soft),var(--surface-2));border-color:var(--gold-2)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 20px;border-radius:14px;border:1px solid var(--border-2);background:var(--surface-2);color:var(--text-0);font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;transition:all .3s var(--ease)}
.btn:hover{transform:translateY(-2px);background:var(--surface-3);box-shadow:var(--shadow)}
.btn:active{transform:translateY(0) scale(.98)}
.btn svg{width:18px;height:18px}
.btn-primary{background:linear-gradient(120deg,var(--gold-2),var(--gold));color:#1a1305;border-color:transparent;box-shadow:0 12px 30px -10px var(--gold-soft)}
.btn-violet{background:linear-gradient(120deg,var(--amethyst-2),var(--amethyst));color:#fff;border-color:transparent;box-shadow:0 12px 30px -10px rgba(124,92,255,.55)}
.btn-ghost{background:transparent}
.btn-danger{background:linear-gradient(120deg,#c0455a,#e06478);color:#fff;border-color:transparent}
.btn-sm{padding:8px 14px;font-size:12.5px;border-radius:11px}
.btn-block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none!important}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-size:12.5px;cursor:pointer;transition:all .25s var(--ease);user-select:none;font-weight:500;font-family:inherit}
.chip:hover{color:var(--text-0);border-color:var(--border-2)}
.chip.on{background:linear-gradient(120deg,var(--gold-soft),var(--surface-2));border-color:var(--gold-2);color:var(--text-0)}
.chip.on::before{content:"✓ ";color:var(--gold)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:9px;font-size:11px;background:var(--gold-soft);color:var(--gold);border:1px solid var(--border);font-weight:600}
.pill{padding:5px 11px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.04em}
.pill.good{background:rgba(142,230,176,.14);color:var(--good)} .pill.warn{background:rgba(242,196,123,.14);color:var(--warn)} .pill.violet{background:rgba(169,139,255,.16);color:var(--amethyst)}

/* timer */
.timer-stage{display:flex;flex-direction:column;align-items:center;gap:24px;padding:30px 20px}
.timer-ring{position:relative;width:290px;height:290px;max-width:78vw;max-height:78vw}
.timer-ring svg{transform:rotate(-90deg)}
.timer-ring .tc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer-ring .tt{font-family:var(--serif);font-size:52px;color:var(--text-0);font-variant-numeric:tabular-nums;line-height:1}
.timer-ring .ts{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--text-3);margin-top:10px}
.timer-ring.running .halo{animation:halo 3s ease-in-out infinite}
@keyframes halo{0%,100%{opacity:.4}50%{opacity:.9}}
.timer-controls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.breath{position:absolute;inset:0;border-radius:50%;border:1px solid var(--border);animation:breath 5.5s ease-in-out infinite;pointer-events:none}
@keyframes breath{0%,100%{transform:scale(.86);opacity:.15}50%{transform:scale(1.05);opacity:.5}}

/* forms */
label.field{display:block;margin-bottom:14px}
label.field>span{display:block;font-size:12px;letter-spacing:.05em;color:var(--text-2);margin-bottom:7px;text-transform:uppercase;font-weight:600}
input,textarea,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text-0);font-family:var(--sans);font-size:14px;transition:.25s var(--ease);outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--gold-2);box-shadow:0 0 0 3px var(--gold-soft);background:var(--surface-2)}
textarea{resize:vertical;min-height:90px;line-height:1.6}
select option{background:var(--bg-2);color:var(--text-0)}
input::placeholder,textarea::placeholder{color:var(--text-3)}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--text-3);pointer-events:none}
.search input{padding-left:42px}
.switch{width:46px;height:26px;border-radius:20px;background:var(--ring-track);border:1px solid var(--border);position:relative;cursor:pointer;transition:.3s var(--ease);flex:0 0 46px}
.switch::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:var(--text-2);top:2px;left:2px;transition:.3s var(--ease-2)}
.switch.on{background:linear-gradient(120deg,var(--gold-2),var(--gold))}
.switch.on::after{left:22px;background:#fff}
.range{-webkit-appearance:none;height:6px;border-radius:6px;background:var(--ring-track);padding:0}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--gold);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4)}

/* modal */
.modal-back{position:fixed;inset:0;z-index:200;background:rgba(6,6,14,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;visibility:hidden;transition:.35s var(--ease)}
.modal-back.on{opacity:1;visibility:visible}
.modal{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:var(--r-lg);background:linear-gradient(160deg,var(--surface-3),var(--surface));border:1px solid var(--border-2);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:var(--shadow),var(--glow);transform:translateY(30px) scale(.96);transition:.4s var(--ease);padding:26px}
.modal-back.on .modal{transform:none}
.modal h3{font-family:var(--serif);font-size:21px;color:var(--text-0);margin:0 0 4px}
.modal .msub{color:var(--text-3);font-size:13px;margin-bottom:20px}
.modal-x{position:absolute;top:16px;right:16px}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}

/* toast */
#toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none;width:min(92vw,440px)}
.toast{pointer-events:auto;width:100%;padding:14px 18px;border-radius:15px;background:linear-gradient(120deg,var(--surface-3),var(--surface-2));border:1px solid var(--border-2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--shadow);display:flex;align-items:center;gap:13px;color:var(--text-0);font-size:14px;transform:translateY(30px);opacity:0;animation:toastIn .5s var(--ease) forwards}
.toast.out{animation:toastOut .4s var(--ease) forwards}
@keyframes toastIn{to{transform:none;opacity:1}}
@keyframes toastOut{to{transform:translateY(20px);opacity:0}}
.toast .ic{width:22px;height:22px;flex:0 0 22px;font-size:20px}
.toast .body b{display:block;font-weight:700}
.toast .body span{font-size:12.5px;color:var(--text-2)}

#confetti{position:fixed;inset:0;z-index:250;pointer-events:none}
.celebrate{position:fixed;inset:0;z-index:260;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0}
.celebrate.on{opacity:1;pointer-events:auto;animation:fadeUp .5s var(--ease)}
.celebrate .card{text-align:center;padding:40px 46px;border-radius:var(--r-lg);background:linear-gradient(160deg,var(--surface-3),var(--surface-2));border:1px solid var(--border-2);backdrop-filter:blur(30px);box-shadow:var(--shadow),0 0 90px -20px var(--gold);transform:scale(.7);animation:pop .7s var(--ease-2) forwards;max-width:400px}
@keyframes pop{to{transform:scale(1)}}
.celebrate .medal{font-size:66px;filter:drop-shadow(0 0 24px var(--gold-soft));animation:pulse 2s ease-in-out infinite}
.celebrate h2{font-family:var(--serif);font-size:28px;color:var(--text-0);margin:16px 0 6px}
.celebrate p{color:var(--text-2);margin:0 0 8px}

/* verse */
.verse{padding:20px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);transition:.35s var(--ease);position:relative;overflow:hidden}
.verse:hover{border-color:var(--border-2);transform:translateY(-3px)}
.verse.hl{background:linear-gradient(120deg,var(--gold-soft),var(--surface-2));border-color:var(--gold-2)}
.verse .ref{font-family:var(--serif);font-size:16px;color:var(--gold);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.verse .txt{font-family:var(--serif);font-size:16.5px;line-height:1.7;color:var(--text-0);font-style:italic}
.verse .meta{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.verse .vact{margin-left:auto;display:flex;gap:6px}
.mini-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--text-2);transition:.25s var(--ease)}
.mini-btn:hover{color:var(--text-0);border-color:var(--border-2);transform:translateY(-2px)}
.mini-btn.fav{color:var(--gold);border-color:var(--gold-2)} .mini-btn.on{color:var(--amethyst);border-color:var(--amethyst)}
.mini-btn svg{width:16px;height:16px}
.votd{padding:28px;border-radius:var(--r-lg);background:linear-gradient(135deg,rgba(124,92,255,.18),var(--gold-soft),var(--surface));border:1px solid var(--border-2);position:relative;overflow:hidden}
.votd::before{content:"❝";position:absolute;top:-18px;left:16px;font-size:120px;font-family:var(--serif);color:var(--text-0);opacity:.06}
.votd .k{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:700}
.votd .q{font-family:var(--serif);font-size:22px;line-height:1.6;color:var(--text-0);font-style:italic;margin:14px 0}
.votd .r{color:var(--text-1);font-weight:600}

.row-card{padding:18px 20px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);transition:.3s var(--ease);cursor:pointer}
.row-card:hover{border-color:var(--border-2);transform:translateY(-2px);background:var(--surface-2)}
.row-head{display:flex;align-items:flex-start;gap:12px}
.row-head h4{margin:0;font-family:var(--serif);font-size:17px;color:var(--text-0);flex:1}
.row-date{font-size:11px;color:var(--text-3);letter-spacing:.06em;white-space:nowrap}
.row-excerpt{color:var(--text-2);font-size:13.5px;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rtx{min-height:200px;border-radius:12px;border:1px solid var(--border);background:var(--surface);padding:14px;color:var(--text-0);line-height:1.7;outline:none;font-size:14.5px}
.rtx:focus{border-color:var(--gold-2);box-shadow:0 0 0 3px var(--gold-soft)}
.rtx:empty:before{content:attr(data-ph);color:var(--text-3)}
.rtx blockquote{border-left:3px solid var(--gold-2);margin:8px 0;padding:4px 14px;color:var(--text-1);font-style:italic}
.rt-toolbar{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.rt-toolbar button{width:36px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text-1);cursor:pointer;font-size:14px;font-weight:700;transition:.2s}
.rt-toolbar button:hover{background:var(--surface-2);color:var(--text-0)}

.timeline{position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--gold),var(--amethyst),transparent)}
.tl{position:relative;padding:0 0 20px 4px}
.tl::before{content:"";position:absolute;left:-24px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--bg-1);border:2px solid var(--gold);box-shadow:0 0 12px var(--gold-soft)}
.tl .tl-date{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.tl .tl-body{color:var(--text-1);font-size:14px;margin-top:3px}
.tl .tl-body b{color:var(--text-0)}

.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;overflow-x:auto;padding-bottom:6px}
.heat .cell{width:13px;height:13px;border-radius:3px;background:var(--ring-track);transition:.2s;cursor:default}
.heat .cell:hover{outline:2px solid var(--gold);outline-offset:1px}
.heat .cell.l1{background:rgba(232,201,138,.28)} .heat .cell.l2{background:rgba(232,201,138,.5)} .heat .cell.l3{background:rgba(232,201,138,.72)} .heat .cell.l4{background:linear-gradient(135deg,var(--gold),var(--amethyst))}
.heat-legend{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:10px;font-size:11px;color:var(--text-3)}
.heat-legend .cell{width:12px;height:12px;border-radius:3px}

.cal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:16px}
.cal-month h5{margin:0 0 10px;font-family:var(--serif);font-size:15px;color:var(--text-0);text-align:center;letter-spacing:.04em}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{font-size:9px;text-align:center;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;padding-bottom:2px}
.cal-day{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:11px;color:var(--text-2);background:var(--ring-track);position:relative;transition:.2s;cursor:pointer}
.cal-day:not(.empty):hover{transform:scale(1.14);outline:2px solid var(--gold);outline-offset:1px;z-index:2}
.cal-day.empty{background:transparent;cursor:default;pointer-events:none}
.cal-day.prayed{color:#1a1305;font-weight:700;background:linear-gradient(135deg,var(--gold),var(--gold-2))}
.cal-day.high{background:linear-gradient(135deg,var(--amethyst),var(--violet));color:#fff}
.cal-day.missed{background:rgba(240,138,154,.12)}
.cal-day.today{outline:2px solid var(--amethyst);outline-offset:1px}
.cal-day.ms::after{content:"★";position:absolute;top:-4px;right:-2px;font-size:9px;color:var(--gold);text-shadow:0 0 6px var(--gold)}

.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.ach{padding:20px 14px;border-radius:var(--r);text-align:center;background:var(--surface);border:1px solid var(--border);position:relative;overflow:hidden;transition:.4s var(--ease)}
.ach .emj{font-size:38px;filter:grayscale(1) brightness(.6);transition:.4s var(--ease)}
.ach .an{font-size:13px;font-weight:700;color:var(--text-2);margin-top:10px}
.ach .ad{font-size:11px;color:var(--text-3);margin-top:3px}
.ach.on{background:linear-gradient(160deg,var(--gold-soft),var(--surface-2));border-color:var(--gold-2);box-shadow:var(--shadow)}
.ach.on .emj{filter:none;animation:floaty 4s ease-in-out infinite}
.ach.on .an{color:var(--text-0)}
.ach.on::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,var(--gold-soft),transparent 70%);opacity:.6}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.ach .lock{position:absolute;top:10px;right:10px;font-size:12px;opacity:.5}

.vision-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.vcard{border-radius:var(--r);overflow:hidden;position:relative;min-height:150px;cursor:pointer;border:1px solid var(--border);transition:.45s var(--ease);display:flex;flex-direction:column;justify-content:flex-end;padding:18px}
.vcard:hover{transform:translateY(-5px) scale(1.02);border-color:var(--border-2);box-shadow:var(--shadow),var(--glow)}
.vcard .grad{position:absolute;inset:0;z-index:-1;opacity:.92}
.vcard .emj{position:absolute;top:14px;left:16px;font-size:32px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
.vcard h4{margin:0;color:#fff;font-family:var(--serif);font-size:18px;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.vcard p{margin:4px 0 0;color:rgba(255,255,255,.82);font-size:12px}
.vcard .dot{position:absolute;top:14px;right:14px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}

.goal{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);transition:.3s var(--ease)}
.goal:hover{border-color:var(--border-2)}
.goal .gc{width:26px;height:26px;flex:0 0 26px;border-radius:9px;border:2px solid var(--border-2);cursor:pointer;display:grid;place-items:center;transition:.25s var(--ease);color:transparent}
.goal .gc.done{background:linear-gradient(135deg,var(--gold),var(--gold-2));border-color:transparent;color:#1a1305}
.goal .gt{flex:1;color:var(--text-0);font-size:15px}
.goal.done .gt{color:var(--text-3);text-decoration:line-through}

.reflect-q{margin-bottom:16px}
.reflect-q label{font-family:var(--serif);font-size:15.5px;color:var(--text-0);display:block;margin-bottom:8px}
.reflect-q .qn{color:var(--gold);margin-right:8px}

.chart-box{position:relative;width:100%}
.chart-box canvas{width:100%;display:block}
.chart-tip{position:absolute;pointer-events:none;background:var(--surface-3);border:1px solid var(--border-2);border-radius:10px;padding:7px 11px;font-size:12px;color:var(--text-0);box-shadow:var(--shadow);transform:translate(-50%,-120%);white-space:nowrap;opacity:0;transition:opacity .15s;z-index:5}
.chart-tip.on{opacity:1}
.bar-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;font-size:12px;color:var(--text-2)}
.bar-legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:middle}
.catbar{margin-bottom:12px}
.catbar .top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;color:var(--text-1)}
.catbar .top b{color:var(--text-0)}
.catbar .track{height:9px;border-radius:8px;background:var(--ring-track);overflow:hidden}
.catbar .track i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--amethyst),var(--gold));transition:width 1.2s var(--ease)}

/* gamification */
.mission{display:flex;align-items:center;gap:14px;padding:15px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);transition:.3s var(--ease)}
.mission:hover{border-color:var(--border-2)}
.mission.done{background:linear-gradient(120deg,var(--gold-soft),var(--surface-2));border-color:var(--gold-2)}
.mission .mi{width:44px;height:44px;flex:0 0 44px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--surface-2)}
.mission .mm{flex:1;min-width:0}
.mission .mm b{color:var(--text-0);font-size:14px}
.mission .mm .mp{height:7px;border-radius:7px;background:var(--ring-track);margin-top:7px;overflow:hidden}
.mission .mm .mp i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--gold),var(--amethyst));transition:width 1s var(--ease)}
.mission .mx{font-size:12px;font-weight:700;color:var(--gold);white-space:nowrap}
.score-card{padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);text-align:center}
.score-card .sv{font-family:var(--serif);font-size:34px;color:var(--text-0);line-height:1}
.score-card .sl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);margin-top:6px}
.rank-hero{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.rank-badge{width:96px;height:96px;flex:0 0 96px;border-radius:24px;display:grid;place-items:center;font-size:44px;background:linear-gradient(145deg,var(--gold-soft),var(--surface-2));border:1px solid var(--border-2);box-shadow:inset 0 0 30px var(--gold-soft)}

/* focus mode */
#focus{position:fixed;inset:0;z-index:400;display:none;flex-direction:column;align-items:center;justify-content:center;gap:34px;background:radial-gradient(1200px 900px at 50% 40%,var(--grad-3),var(--bg-0) 75%)}
#focus.on{display:flex;animation:appIn .8s var(--ease)}
#focus canvas{position:absolute;inset:0;z-index:-1}
#focus .fx-time{font-family:var(--serif);font-size:clamp(56px,14vw,120px);color:var(--text-0);font-variant-numeric:tabular-nums;line-height:1;text-shadow:0 0 40px var(--gold-soft)}
#focus .fx-guide{font-size:14px;letter-spacing:.28em;text-transform:uppercase;color:var(--text-2);height:18px;transition:.5s}
#focus .fx-ring{position:absolute;width:min(70vmin,520px);height:min(70vmin,520px);border-radius:50%;border:1px solid var(--border);z-index:-1}
#focus .fx-ring.b{animation:breathBig 10s ease-in-out infinite}
@keyframes breathBig{0%,100%{transform:scale(.8);opacity:.2;border-color:var(--gold-soft)}50%{transform:scale(1.12);opacity:.55;border-color:var(--amethyst)}}
#focus .fx-controls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#focus .fx-cat{color:var(--text-3);font-size:13px;max-width:80vw;text-align:center}

/* insights */
.insight{display:flex;gap:12px;padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);margin-bottom:10px}
.insight .ii{font-size:22px}
.insight .it b{color:var(--text-0)} .insight .it{font-size:13.5px;color:var(--text-2)}

.empty{text-align:center;padding:44px 20px;color:var(--text-3)}
.empty .e-emj{font-size:44px;opacity:.7;margin-bottom:12px}
.empty p{margin:6px 0 0;font-size:14px}
.seg{display:inline-flex;padding:4px;border-radius:13px;background:var(--surface);border:1px solid var(--border);gap:4px}
.seg button{padding:8px 15px;border-radius:9px;border:none;background:transparent;color:var(--text-2);font-size:12.5px;font-weight:600;cursor:pointer;transition:.25s var(--ease);font-family:inherit}
.seg button.on{background:var(--surface-3);color:var(--text-0);box-shadow:var(--shadow)}
.fab{position:fixed;right:24px;bottom:24px;z-index:80;width:60px;height:60px;border-radius:20px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--gold),var(--amethyst));color:#fff;display:grid;place-items:center;box-shadow:0 18px 40px -12px rgba(124,92,255,.6);transition:.35s var(--ease);animation:floaty 5s ease-in-out infinite}
.fab:hover{transform:scale(1.08) rotate(90deg)}
.fab svg{width:26px;height:26px}

/* ============================== STORAGE =============================== *
 * Layered durability:
 *   1) IndexedDB  → primary durable store + backup snapshots (large-data safe)
 *   2) localStorage → mirror + SYNCHRONOUS flush on pagehide/beforeunload
 *   3) memory     → last resort (opaque/sandboxed origins)
 * On load, the newest valid copy (by updatedAt) across LS + IDB wins.
 * ---------------------------------------------------------------------- */
const Storage = (() => {
  let db=null, idbOk=false, lsOk=false;
  function testLS(){ try{ const k='__wtest'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }catch(e){ return false; } }
  function openDB(){ return new Promise(res=>{
    let done=false; const finish=v=>{ if(!done){done=true;res(v);} };
    try{
      if(!('indexedDB' in window)) return finish(false);
      const req=indexedDB.open(CONFIG.DB_NAME,1);
      req.onupgradeneeded=e=>{ const d=e.target.result;
        if(!d.objectStoreNames.contains(CONFIG.DB_STORE)) d.createObjectStore(CONFIG.DB_STORE);
        if(!d.objectStoreNames.contains(CONFIG.DB_BACKUPS)) d.createObjectStore(CONFIG.DB_BACKUPS,{keyPath:'ts'}); };
      req.onsuccess=e=>{ db=e.target.result; idbOk=true; finish(true); };
      req.onerror=()=>finish(false);
      req.onblocked=()=>finish(false);
      setTimeout(()=>finish(idbOk),1500); // never hang boot
    }catch(e){ finish(false); }
  }); }
  function idbPut(store,val,key){ return new Promise((res,rej)=>{ if(!db)return rej(new Error('no db')); try{ const tx=db.transaction(store,'readwrite'); const os=tx.objectStore(store); const r=key===undefined?os.put(val):os.put(val,key); r.onsuccess=()=>res(true); r.onerror=()=>rej(r.error);}catch(e){rej(e);} }); }
  function idbGet(store,key){ return new Promise((res,rej)=>{ if(!db)return rej(new Error('no db')); try{ const r=db.transaction(store,'readonly').objectStore(store).get(key); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);}catch(e){rej(e);} }); }
  function idbAll(store){ return new Promise((res,rej)=>{ if(!db)return rej(new Error('no db')); try{ const r=db.transaction(store,'readonly').objectStore(store).getAll(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error);}catch(e){rej(e);} }); }
  function idbDel(store,key){ return new Promise(res=>{ if(!db)return res(); try{ const r=db.transaction(store,'readwrite').objectStore(store).delete(key); r.onsuccess=()=>res(); r.onerror=()=>res(); }catch(e){res();} }); }

  async function init(){ lsOk=testLS(); await openDB(); return {lsOk,idbOk}; }

  // Persist current state to every available backend (best-effort, non-throwing)
  async function persist(obj){
    const json=JSON.stringify(obj);
    if(lsOk){ try{ localStorage.setItem(CONFIG.LS_KEY,json); }catch(e){ /* quota → rely on idb */ } }
    if(idbOk){ try{ await idbPut(CONFIG.DB_STORE,obj,'current'); }catch(e){} }
  }
  // Synchronous flush for unload (localStorage only)
  function flush(obj){ if(!lsOk) return; try{ localStorage.setItem(CONFIG.LS_KEY,JSON.stringify(obj)); }catch(e){} }

  async function load(){
    const found=[];
    if(lsOk){ try{ const raw=localStorage.getItem(CONFIG.LS_KEY); if(raw) found.push(JSON.parse(raw)); }catch(e){} }
    if(idbOk){ try{ const o=await idbGet(CONFIG.DB_STORE,'current'); if(o) found.push(o); }catch(e){} }
    let best=null;
    for(const c of found){ if(validate(c) && (!best || (c.updatedAt||0)>(best.updatedAt||0))) best=c; }
    if(!best){ // attempt recovery from newest backup
      try{ const bks=await listBackups(); if(bks.length){ const b=bks[bks.length-1]; if(validate(b.data)) best=b.data; } }catch(e){}
    }
    return best;
  }

  async function backup(obj){ if(!idbOk) return; try{
    await idbPut(CONFIG.DB_BACKUPS,{ts:Date.now(),data:clone(obj)});
    const all=await idbAll(CONFIG.DB_BACKUPS);
    all.sort((a,b)=>a.ts-b.ts);
    while(all.length>CONFIG.BACKUP_LIMIT){ const rm=all.shift(); await idbDel(CONFIG.DB_BACKUPS,rm.ts); }
  }catch(e){} }
  async function listBackups(){ if(!idbOk) return []; try{ const a=await idbAll(CONFIG.DB_BACKUPS); a.sort((x,y)=>x.ts-y.ts); return a; }catch(e){ return []; } }
  async function clearAll(){ if(lsOk){ try{ localStorage.removeItem(CONFIG.LS_KEY); }catch(e){} } if(idbOk){ try{ await idbDel(CONFIG.DB_STORE,'current'); }catch(e){} } }

  return {init,persist,flush,load,backup,listBackups,clearAll,status:()=>({local:lsOk,idb:idbOk})};
})();

/* Integrity + migration ------------------------------------------------- */
function validate(o){ return !!o && typeof o==='object' && Array.isArray(o.sessions) && Array.isArray(o.journal); }
function sanitize(o){
  o.sessions=(o.sessions||[]).filter(s=>s&&typeof s.sec==='number'&&s.sec>0&&typeof s.start==='number').map(s=>({
    id:s.id||uid(), start:s.start, end:s.end||s.start+s.sec*1000, sec:Math.round(s.sec),
    cats:Array.isArray(s.cats)?s.cats:[], note:typeof s.note==='string'?s.note:'', manual:!!s.manual
  }));
  o.journal=(o.journal||[]).filter(e=>e&&typeof e==='object').map(e=>({
    id:e.id||uid(), ts:e.ts||Date.now(), title:e.title||'', html:e.html||'', category:e.category||JOURNAL_CATEGORIES[0],
    tags:Array.isArray(e.tags)?e.tags:[], fav:!!e.fav, images:Array.isArray(e.images)?e.images:[], mood:e.mood||''
  }));
  o.verseMeta=o.verseMeta&&typeof o.verseMeta==='object'?o.verseMeta:{};
  o.reflections=o.reflections&&typeof o.reflections==='object'?o.reflections:{};
  o.vision=o.vision&&typeof o.vision==='object'?o.vision:{};
  o.goals=Array.isArray(o.goals)&&o.goals.length?o.goals:clone(DEFAULT_GOALS);
  o.achievements=Array.isArray(o.achievements)?o.achievements:[];
  o.recentVerses=Array.isArray(o.recentVerses)?o.recentVerses:[];
  o.settings=Object.assign({theme:'dark',accent:'gold',motion:'full',performance:false,sound:true,soundVol:0.4},o.settings||{});
  if(!o.createdAt) o.createdAt=Date.now();
  return o;
}
function migrate(o){
  if(!o) return freshState();
  const v=o.__v||1;
  if(v<3){ // v1/v2 → v3: add fields, keep data
    o.recentVerses=o.recentVerses||[];
    o.settings=Object.assign({theme:'dark',accent:'gold',motion:'full',performance:false,sound:true,soundVol:0.4},o.settings||{});
  }
  o.__v=CONFIG.SCHEMA_VERSION;
  return sanitize(o);
}
function freshState(){ return sanitize({ __v:CONFIG.SCHEMA_VERSION, sessions:[], journal:[], verseMeta:{}, goals:clone(DEFAULT_GOALS), reflections:{}, vision:{}, achievements:[], recentVerses:[], settings:{theme:'dark',accent:'gold',motion:'full',performance:false,sound:true,soundVol:0.4}, createdAt:Date.now(), updatedAt:Date.now() }); }

/* =============================== STORE ================================ *
 * Global reactive state with autosave, undo/redo history and change events.
 * ---------------------------------------------------------------------- */
let state = freshState();
const _subs = new Set();
let _history=[], _future=[], _lastSnap=null, _lastBackup=0;
const _persistDebounced = debounce(()=>{ Storage.persist(state).then(()=>{
  if(Date.now()-_lastBackup>CONFIG.AUTOBACKUP_MS){ _lastBackup=Date.now(); Storage.backup(state); }
}); }, 220);

function onChange(fn){ _subs.add(fn); return ()=>_subs.delete(fn); }
function emit(){ _subs.forEach(f=>{ try{ f(state); }catch(e){ console.warn(e); } }); }

/* save(): record undo point, persist to all backends, notify subscribers */
function save(opts={}){
  state.updatedAt=Date.now();
  if(_lastSnap!==null && opts.history!==false){ _history.push(_lastSnap); if(_history.length>CONFIG.HISTORY_LIMIT) _history.shift(); _future.length=0; }
  _lastSnap=JSON.stringify(state);
  _persistDebounced();
  emit();
}
function saveNow(){ state.updatedAt=Date.now(); _lastSnap=JSON.stringify(state); Storage.persist(state); Storage.flush(state); emit(); }
function undo(){ if(!_history.length){ toast('Nothing to undo'); return; } _future.push(JSON.stringify(state)); state=migrate(JSON.parse(_history.pop())); _lastSnap=JSON.stringify(state); Storage.persist(state); applyPrefs(); rerender(); toast('Undo','Reverted last change','↩️',1600); }
function redo(){ if(!_future.length){ toast('Nothing to redo'); return; } _history.push(JSON.stringify(state)); state=migrate(JSON.parse(_future.pop())); _lastSnap=JSON.stringify(state); Storage.persist(state); applyPrefs(); rerender(); toast('Redo','Reapplied change','↪️',1600); }

/* ============================ BUSINESS LOGIC ========================== */
const avg = a => a.length? a.reduce((x,y)=>x+y,0)/a.length : 0;
function std(a){ if(a.length<2) return 0; const m=avg(a); return Math.sqrt(avg(a.map(x=>(x-m)*(x-m)))); }

function computeStats(){
  const s=state.sessions.slice().sort((a,b)=>a.start-b.start);
  const totalSec=s.reduce((a,x)=>a+x.sec,0);
  const hours=totalSec/3600;
  const remaining=Math.max(0,CONFIG.GOAL_HOURS-hours);
  const pct=Math.min(100,hours/CONFIG.GOAL_HOURS*100);
  const byDay={}; s.forEach(x=>{ const k=dateKey(x.start); byDay[k]=(byDay[k]||0)+x.sec; });
  const days=Object.keys(byDay); const activeDays=days.length;
  const firstTs=s.length?s[0].start:Date.now();
  const spanDays=Math.max(1,Math.round((Date.now()-new Date(dateKey(firstTs)).getTime())/DAY)+1);
  const dailyAvg=totalSec/spanDays/3600;
  const perActiveDay=activeDays?totalSec/activeDays/3600:0;
  const weeklyAvg=dailyAvg*7, monthlyAvg=dailyAvg*30.4;
  // streaks
  const daySet=new Set(days); const sorted=days.slice().sort();
  let longest=0,run=0,prev=null;
  sorted.forEach(k=>{ if(prev && (new Date(k)-new Date(prev))===DAY) run++; else run=1; longest=Math.max(longest,run); prev=k; });
  let curStreak=0, probe=new Date(todayKey());
  if(!daySet.has(dateKey(probe.getTime()))) probe.setDate(probe.getDate()-1);
  while(daySet.has(dateKey(probe.getTime()))){ curStreak++; probe.setDate(probe.getDate()-1); }
  // categories (seconds, split across selected)
  const byCat={}; CATEGORIES.forEach(c=>byCat[c]=0);
  s.forEach(x=>{ const cats=(x.cats&&x.cats.length)?x.cats:['(Uncategorized)']; const share=x.sec/cats.length; cats.forEach(c=>{ byCat[c]=(byCat[c]||0)+share; }); });
  // skipped days within active span
  let skipped=0; if(days.length){ const startK=sorted[0]; let d=new Date(startK); const stop=new Date(Math.min(Date.now(),CONFIG.DEADLINE.getTime()));
    while(d<=stop){ if(!daySet.has(dateKey(d.getTime()))) skipped++; d.setDate(d.getDate()+1); } }
  const longestSession=s.reduce((m,x)=>Math.max(m,x.sec),0);
  const avgSession=s.length?totalSec/s.length:0;
  return {sessions:s,count:s.length,totalSec,hours,remaining,pct,byDay,days,activeDays,spanDays,dailyAvg,perActiveDay,weeklyAvg,monthlyAvg,longest,curStreak,byCat,skipped,longestSession,avgSession,daySet};
}

/* ---- FORECAST: recency-weighted, variance-aware, 3 scenarios + confidence ---- */
function computeForecast(st){
  const now=Date.now();
  const daysLeft=Math.max(0,Math.ceil((CONFIG.DEADLINE-now)/DAY));
  if(st.remaining<=0){ return {done:true,daysLeft,expected:{label:'Complete 🎉',confidence:100},best:{label:'Complete'},worst:{label:'Complete'},onTime:100}; }
  const remaining=st.remaining;
  // last-30-day daily hour series
  const series=[]; for(let i=29;i>=0;i--){ series.push((st.byDay[dateKey(now-i*DAY)]||0)/3600); }
  const rate7=avg(series.slice(-7)), rate14=avg(series.slice(-14)), rate30=avg(series);
  const overall=st.dailyAvg;
  // recency-biased base rate
  let base=0.45*rate14+0.25*rate30+0.30*overall;
  if(base<=1e-6) base = overall>0?overall:(rate7>0?rate7:0);
  const consistency=clamp(st.activeDays/Math.max(1,st.spanDays),0,1);
  const streakBoost=1+clamp(st.curStreak/60,0,0.25);
  const skipPenalty=1-clamp(st.skipped/Math.max(1,st.spanDays)*0.35,0,0.3);
  const expRate=Math.max(1e-4, base*(0.80+0.30*consistency)*streakBoost*skipPenalty);
  const sigma=std(series)||expRate*0.5;
  const bestRate=Math.max(expRate*1.15, rate7*1.1, expRate+sigma);
  const worstRate=Math.max(1e-4, Math.min(expRate*0.72, Math.max(expRate-sigma, overall*0.55)));
  const mk=rate=>{ const d=remaining/rate; const date=new Date(now+d*DAY); return {date,days:Math.ceil(d),perDay:rate,label:date.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}),late:date>CONFIG.DEADLINE}; };
  const expected=mk(expRate), best=mk(bestRate), worst=mk(worstRate);
  const neededPerDay=daysLeft>0?remaining/daysLeft:remaining;
  const margin=(expRate-neededPerDay)/((sigma||expRate*0.5)+1e-6);
  const onTime=clamp(100/(1+Math.exp(-1.5*margin)),1,99);
  expected.confidence=Math.round(onTime);
  best.confidence=Math.round(clamp(onTime+18,5,99));
  worst.confidence=Math.round(clamp(onTime-24,1,96));
  return {done:false,daysLeft,neededPerDay,expected,best,worst,onTime:Math.round(onTime),expRate,sigma,consistency,rate7,rate14,rate30};
}

/* ---- GAMIFICATION ---- */
function reflectionCount(){ return Object.values(state.reflections).filter(r=>r&&Object.values(r).some(v=>(v||'').trim())).length; }
function xpForLevel(L){ return Math.round(80*Math.pow(Math.max(0,L-1),1.62)); } // cumulative XP to reach level L
function levelFromXP(xp){ let L=1; while(xpForLevel(L+1)<=xp && L<99) L++; return L; }
function rankForLevel(L){ let r=RANKS[0]; for(const x of RANKS) if(L>=x.lv) r=x; return r; }
function computeGame(st){
  const unlocked=unlockedIds(st);
  const xp=Math.round(st.hours*100 + st.count*20 + st.activeDays*15 + (st.longestSession/3600)*10 +
    state.journal.length*30 + reflectionCount()*25 + unlocked.size*150 + state.goals.filter(g=>g.done).length*40 + st.longest*12);
  const level=levelFromXP(xp);
  const cur=xpForLevel(level), next=xpForLevel(level+1);
  const into=xp-cur, span=Math.max(1,next-cur);
  const rank=rankForLevel(level), nextRank=RANKS.find(r=>r.lv>level)||null;
  // scores
  const weeksLeft=Math.max(1,Math.ceil((CONFIG.DEADLINE-Date.now())/(7*DAY)));
  const targetWeekly=st.remaining/weeksLeft;
  const consistency=clamp(Math.round((st.activeDays/Math.max(7,st.spanDays))*70 + Math.min(30,st.curStreak*1.5)),0,100);
  const devotion=clamp(Math.round((st.weeklyAvg/Math.max(0.1,targetWeekly))*100),0,100);
  const growth=clamp(Math.round(state.journal.length*4 + reflectionCount()*4 + state.goals.filter(g=>g.done).length*6 + Object.keys(state.vision).length*2),0,100);
  const wisdom=clamp(Math.round(0.34*consistency+0.28*devotion+0.20*growth+0.18*st.pct),0,100);
  return {xp,level,rank,nextRank,into,span,pctToNext:Math.round(into/span*100),cur,next,scores:{consistency,devotion,growth,wisdom},unlocked};
}

function unlockedIds(st){

const Sound = (()=>{
  let ac=null, ambient=null;
  function ctx(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ ac=null; } } return ac; }
  function vol(){ return clamp(state.settings.soundVol??0.4,0,1); }
  function chime(){ if(!state.settings.sound) return; const c=ctx(); if(!c) return; try{ if(c.state==='suspended')c.resume();
    [523.25,659.25,783.99].forEach((f,i)=>{ const o=c.createOscillator(),g=c.createGain(); o.type='sine'; o.frequency.value=f; const t=c.currentTime+i*0.09;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.14*vol(),t+0.03); g.gain.exponentialRampToValueAtTime(0.0001,t+1.6);
      o.connect(g).connect(c.destination); o.start(t); o.stop(t+1.7); }); }catch(e){} }
  function startAmbient(){ if(!state.settings.sound) return; const c=ctx(); if(!c||ambient) return; try{ if(c.state==='suspended')c.resume();
    const master=c.createGain(); master.gain.value=0; master.connect(c.destination);
    const freqs=[110,164.81,220]; const oscs=freqs.map(f=>{ const o=c.createOscillator(),g=c.createGain(); o.type='sine'; o.frequency.value=f; g.gain.value=0.06; const l=c.createOscillator(),lg=c.createGain(); l.frequency.value=0.06+Math.random()*0.05; lg.gain.value=0.02; l.connect(lg).connect(g.gain); l.start(); o.connect(g).connect(master); o.start(); return o; });
    master.gain.linearRampToValueAtTime(0.18*vol(),c.currentTime+2.5); ambient={master,oscs}; }catch(e){} }
  function stopAmbient(){ if(!ambient) return; const c=ctx(); try{ ambient.master.gain.linearRampToValueAtTime(0,c.currentTime+1.2); const a=ambient; ambient=null; setTimeout(()=>{ try{a.oscs.forEach(o=>o.stop());}catch(e){} },1400); }catch(e){ ambient=null; } }
  return {chime,startAmbient,stopAmbient};
})();

    else out.push({i:'⏳',t:`To reach 1,000 by Dec 31 you need about <b>${fc.neededPerDay.toFixed(2)}h/day</b>. Consider one extra session this week.`}); }
  // best time of day
  const hrs=state.sessions.map(x=>new Date(x.start).getHours()); if(hrs.length>=4){ const buckets={morning:0,afternoon:0,evening:0,night:0}; hrs.forEach(h=>{ buckets[h<12?'morning':h<17?'afternoon':h<22?'evening':'night']++; }); const top=Object.entries(buckets).sort((a,b)=>b[1]-a[1])[0][0]; out.push({i:'🕰️',t:`You pray most in the <b>${top}</b>. Guard that window as sacred.`}); }
  // least-prayed category
  const zero=CATEGORIES.filter(c=>(st.byCat[c]||0)===0); if(zero.length&&st.count>0) out.push({i:'🧭',t:`You haven't yet prayed for <b>${esc(zero[0])}</b>. Consider adding it to your next session.`});
  out.push({i:'✨',t:`You're <b>${g.pctToNext}%</b> toward Level ${g.level+1}. Keep pressing in.`});
  return out.slice(0,4);
}

function firstImg(html){ const m=/<img[^>]+src="([^"]+)"/.exec(html||''); return m?m[1]:null; }
function updateJournal(){ const q=jrnState.q.trim().toLowerCase();
  let list=state.journal.slice().sort((a,b)=>b.ts-a.ts).filter(e=>{ if(jrnState.cat!=='All'&&e.category!==jrnState.cat)return false; if(jrnState.favOnly&&!e.fav)return false; if(q){ const h=(e.title+' '+stripHTML(e.html)+' '+(e.tags||[]).join(' ')+' '+(e.category||'')).toLowerCase(); if(!h.includes(q))return false; } return true; });

  <div class="section-title">${svgIco('<path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7.4L12 17l-6.3 4.4L8 14 2 9.4h7.6z"/>')} Streak Milestones</div>
  <div class="ach-grid">${ACHIEVEMENTS.filter(a=>a.type==='streak').map(a=>achCard(a,un.has(a.id),st)).join('')}</div>
  <div class="section-title">${svgIco('<path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/>')} Special Honors</div>
  <div class="ach-grid">${ACHIEVEMENTS.filter(a=>a.type==='special').map(a=>achCard(a,un.has(a.id),st)).join('')}</div>
