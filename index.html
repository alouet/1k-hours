function finishReflection(){ saveReflection(); checkAchievements(); checkLevelUp(); burstConfetti(60); toast('Reflection complete','Well done, faithful one','🕯️',3200); renderReflPast(); }
function renderReflPast(){ const keys=Object.keys(state.reflections).filter(k=>{ const r=state.reflections[k]; return r&&Object.values(r).some(v=>(v||'').trim()); }).sort().reverse();
  const w=$('#reflPast'); if(!w)return; if(!keys.length){ w.innerHTML=`<div class="glass pad"><div class="empty"><div class="e-emj">🌙</div><p>No reflections yet. Begin tonight.</p></div></div>`; return; }
  w.innerHTML=`<div class="grid" style="gap:12px">${keys.slice(0,30).map(k=>{ const r=state.reflections[k]; const first=REFLECTION_QUESTIONS.map(q=>r[q.k]).find(v=>(v||'').trim())||'';
    return `<div class="row-card" onclick="reflDate='${k}';renderReflection();window.scrollTo({top:0,behavior:'smooth'})"><div class="row-head"><h4>${fmtDate(new Date(k+'T12:00:00').getTime())}</h4><span class="row-date">${Object.values(r).filter(v=>(v||'').trim()).length}/7 answered</span></div><div class="row-excerpt">${esc(first.slice(0,140))}</div></div>`; }).join('')}</div>`; }

/* ============================== PRAYER CALENDAR ==================== */
function renderCalendar(){ const st=computeStats(), byDay=st.byDay; const ms=new Set(growthEvents().map(e=>dateKey(e.ts)));
  const days=Object.keys(byDay).filter(k=>k.startsWith('2026')); const prayed=days.length; const high=days.filter(k=>byDay[k]>=7200).length;
  let missed=0; if(days.length){ let d=new Date(days.slice().sort()[0]+'T12:00:00'); const stop=new Date(Math.min(Date.now(),CONFIG.DEADLINE.getTime())); while(d<=stop){ const k=dateKey(d.getTime()); if(k.startsWith('2026')&&!byDay[k])missed++; d.setDate(d.getDate()+1); } }
  const names=['January','February','March','April','May','June','July','August','September','October','November','December'];
  $('#view-calendar').innerHTML=`<div class="grid s4">${statCard('Prayer Days','✅',prayed,'','active')}${statCard('High Activity','🔥',high,'','2h+ days')}${statCard('Missed Days','🌫️',missed,'','since you began')}${statCard('Milestones','⭐',ms.size,'','crossed')}</div>
  <div class="glass pad mt"><div class="heat-legend" style="justify-content:flex-start;flex-wrap:wrap;gap:14px"><span><span class="cal-day prayed" style="width:14px;height:14px;display:inline-block;vertical-align:middle"></span> Prayed</span><span><span class="cal-day high" style="width:14px;height:14px;display:inline-block;vertical-align:middle"></span> High (2h+)</span><span><span class="cal-day missed" style="width:14px;height:14px;display:inline-block;vertical-align:middle"></span> Missed</span><span><span class="cal-day today" style="width:14px;height:14px;display:inline-block;vertical-align:middle"></span> Today</span><span>★ Milestone</span> <span class="muted">· tap any day to log</span></div></div>
  <div class="cal-grid mt">${names.map((n,m)=>monthCal(2026,m,n,byDay,ms)).join('')}</div>`;
}
function monthCal(y,mo,name,byDay,ms){ const start=new Date(y,mo,1).getDay(); const dim=new Date(y,mo+1,0).getDate(); const tk=todayKey(); let cells='';
  for(let i=0;i<start;i++)cells+='<div class="cal-day empty"></div>';
  for(let d=1;d<=dim;d++){ const k=y+'-'+pad(mo+1)+'-'+pad(d); const sec=byDay[k]||0; let cls='cal-day'; if(sec>=7200)cls+=' high'; else if(sec>0)cls+=' prayed'; else{ if(new Date(y,mo,d)<new Date(tk+'T00:00:00'))cls+=' missed'; } if(k===tk)cls+=' today'; if(ms.has(k))cls+=' ms';
    cells+=`<div class="${cls}" title="${sec>0?(sec/3600).toFixed(2)+'h — tap to add':'Tap to log prayer'}" onclick="openManualAdd('${k}')">${d}</div>`; }
  return `<div class="cal-month glass pad lift"><h5>${name}</h5><div class="cal-days">${['S','M','T','W','T','F','S'].map(x=>`<div class="cal-dow">${x}</div>`).join('')}${cells}</div></div>`; }

/* ============================== VISION BOARD ======================= */
function renderVision(){ $('#view-vision').innerHTML=`<p class="muted" style="font-size:14px;max-width:640px">Why do you seek His wisdom? Let these anchor your heart. Tap any card to expand it and record what it means for your journey.</p>
  <div class="vision-grid mt">${VISION_CARDS.map(c=>{ const note=state.vision[c.k]; return `<div class="vcard" onclick="openVision('${c.k}')"><div class="grad" style="background:${c.g}"></div><div class="emj">${c.emj}</div>${note?'<div class="dot"></div>':''}<h4>${esc(c.title)}</h4><p>${esc(c.sub)}</p></div>`; }).join('')}</div>`; }
function openVision(k){ const c=VISION_CARDS.find(x=>x.k===k),note=state.vision[k]||'';
  openModal(`<div style="height:120px;border-radius:16px;margin:-6px 0 16px;background:${c.g};display:flex;align-items:flex-end;padding:16px;position:relative"><div style="position:absolute;top:14px;left:16px;font-size:40px">${c.emj}</div><h3 style="color:#fff;margin:0;text-shadow:0 2px 12px rgba(0,0,0,.5)">${esc(c.title)}</h3></div><div class="msub">${esc(c.sub)}</div><label class="field"><span>What this means for me</span><textarea id="visNote" placeholder="Why this matters, the vision God gave me, the prayer I hold…">${esc(note)}</textarea></label><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Close</button><button class="btn btn-primary" onclick="saveVision('${k}')">Save</button></div>`); }
function saveVision(k){ const v=$('#visNote').value.trim(); if(v)state.vision[k]=v; else delete state.vision[k]; save(); closeModal(); renderVision(); toast('Vision saved','Keep it before your eyes','🖼️'); }

/* ============================== SETTINGS ============================ */
function renderSettings(){
  const s=state.settings; const stat=Storage.status(); let size=0; try{ size=new Blob([JSON.stringify(state)]).size; }catch(e){}
  $('#view-settings').innerHTML=`
  <div class="grid two">
    <div class="glass pad lift">
      <div class="section-title" style="margin:0 0 12px">${svgIco('<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>')} Appearance</div>
      <div class="between" style="padding:8px 0"><span>Theme</span><button class="btn btn-sm" onclick="toggleTheme();renderSettings()">${document.documentElement.getAttribute('data-theme')==='dark'?'🌙 Dark':'☀️ Light'}</button></div>
      <div class="divider"></div>
      <div style="padding:4px 0"><span class="muted" style="font-size:12px;text-transform:uppercase;letter-spacing:.08em">Accent color</span>
        <div class="wrap" style="margin-top:10px">${ACCENTS.map(a=>`<button onclick="setAccent('${a.k}')" aria-label="${a.l}" title="${a.l}" style="width:34px;height:34px;border-radius:11px;border:2px solid ${s.accent===a.k?'var(--text-0)':'transparent'};background:${a.c};cursor:pointer"></button>`).join('')}</div></div>
      <div class="divider"></div>
      <div class="between" style="padding:6px 0"><span>Motion</span><div class="seg"><button class="${s.motion==='full'?'on':''}" onclick="setMotion('full')">Full</button><button class="${s.motion==='reduced'?'on':''}" onclick="setMotion('reduced')">Reduced</button><button class="${s.motion==='off'?'on':''}" onclick="setMotion('off')">Off</button></div></div>
      <div class="between" style="padding:6px 0"><div><div>Performance mode</div><div class="muted" style="font-size:12px">Disables ambient effects & blur</div></div><div class="switch ${s.performance?'on':''}" role="switch" aria-checked="${s.performance}" tabindex="0" onclick="togglePerf()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();togglePerf()}"></div></div>
      <div class="between" style="padding:6px 0"><div><div>Ambient sound</div><div class="muted" style="font-size:12px">Gentle tones during prayer</div></div><div class="switch ${s.sound?'on':''}" role="switch" aria-checked="${s.sound}" tabindex="0" onclick="toggleSound()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleSound()}"></div></div>
      ${s.sound?`<div style="padding:4px 0"><input class="range" type="range" min="0" max="1" step="0.05" value="${s.soundVol}" oninput="setVol(this.value)"></div>`:''}
    </div>
    <div class="glass pad lift">
      <div class="section-title" style="margin:0 0 12px">${svgIco('<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>')} Data & Backup</div>
      <button class="btn btn-primary btn-block" onclick="exportData()">${ico('<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/>')} Export Backup (JSON)</button>
      <button class="btn btn-block mt-s" onclick="$('#importFile').click()">${ico('<path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/>')} Import Backup</button>
      <input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="importData(event)">
      <div class="grid two mt-s" style="gap:8px"><button class="btn btn-sm" onclick="createBackupNow()">💾 Snapshot Now</button><button class="btn btn-sm" onclick="openRestore()">↺ Restore…</button></div>
      <div class="divider"></div>
      <div class="between" style="padding:3px 0"><span class="muted" style="font-size:13px">Primary store</span><span class="pill ${stat.idb?'good':'warn'}">${stat.idb?'IndexedDB ✓':'unavailable'}</span></div>
      <div class="between" style="padding:3px 0"><span class="muted" style="font-size:13px">Mirror store</span><span class="pill ${stat.local?'good':'warn'}">${stat.local?'localStorage ✓':'unavailable'}</span></div>
      <div class="between" style="padding:3px 0"><span class="muted" style="font-size:13px">Storage used</span><b>${(size/1024).toFixed(1)} KB</b></div>
      <div class="between" style="padding:3px 0"><span class="muted" style="font-size:13px">Sessions · Journal</span><b>${state.sessions.length} · ${state.journal.length}</b></div>
      <div class="between" style="padding:3px 0"><span class="muted" style="font-size:13px">Saved since</span><b>${fmtDate(state.createdAt)}</b></div>
      ${!stat.idb&&!stat.local?`<div class="banner mt" style="margin:12px 0 0">⚠️ This preview blocks storage. Deploy the app or open the file directly for saving. Use Export to back up now.</div>`:''}
    </div>
  </div>
  <div class="glass pad mt lift"><div class="section-title" style="margin:0 0 12px">${svgIco('<path d="M4 6h16M4 12h10M4 18h7"/>')} Keyboard Shortcuts</div>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px">${[['P','Start prayer'],['F','Focus mode'],['Space','Start / pause timer'],['D','Dashboard'],['L','Library'],['J','Journal'],['A','Analytics'],['T','Toggle theme'],['⌘/Ctrl Z','Undo'],['⌘/Ctrl Y','Redo'],['1–9','Jump to section'],['Esc','Close dialog']].map(k=>`<div class="flex" style="gap:10px"><kbd>${k[0]}</kbd><span class="muted" style="font-size:13px">${k[1]}</span></div>`).join('')}</div></div>
  <div class="glass pad mt" style="border-color:rgba(240,138,154,.3)"><div class="section-title" style="margin:0 0 8px">${svgIco('<path d="M12 9v4M12 17h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/>')} Danger Zone</div><p class="muted" style="font-size:13.5px">Permanently erase all data and start fresh. Export a backup first — this cannot be undone.</p><button class="btn btn-danger mt" onclick="confirmReset()">${ico('<path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>')} Reset Everything</button></div>
  <div class="center muted mt" style="font-size:12px;letter-spacing:.08em;padding:20px">THE 1,000 HOURS OF WISDOM™ · "The fear of the LORD is the beginning of wisdom." · All data stays on your device.</div>`;
}
function setAccent(k){ state.settings.accent=k; save(); applyPrefs(); renderSettings(); toast('Accent updated','','🎨',1400); }
function setMotion(m){ state.settings.motion=m; save(); applyPrefs(); renderSettings(); }
function togglePerf(){ state.settings.performance=!state.settings.performance; save(); applyPrefs(); renderSettings(); }
function toggleSound(){ state.settings.sound=!state.settings.sound; if(!state.settings.sound)Sound.stopAmbient(); save(); renderSettings(); }
function setVol(v){ state.settings.soundVol=parseFloat(v); save({history:false}); }
function exportData(){ const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}); const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download='wisdom-1000-backup-'+todayKey()+'.json'; a.click(); URL.revokeObjectURL(u); toast('Backup exported','Keep it somewhere safe','💾'); }
function importData(ev){ const f=ev.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!validate(d))throw 0;
  openModal(`<h3>Import this backup?</h3><div class="msub">Replaces current data with the file (${(d.sessions||[]).length} sessions, ${(d.journal||[]).length} entries).</div><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="doImport()">Replace & Import</button></div>`); window._imp=d;
  }catch(e){ toast('Invalid file','Not a valid backup','⚠️'); } ev.target.value=''; }; r.readAsText(f); }
function doImport(){ if(window._imp){ state=migrate(window._imp); _lastSnap=null; save({history:false}); window._imp=null; } closeModal(); applyPrefs(); go('dashboard'); toast('Backup restored','Welcome back to your journey','🕊️'); }
async function createBackupNow(){ await Storage.backup(state); toast('Snapshot saved','Stored safely in your device','💾'); }
async function openRestore(){ const list=await Storage.listBackups();
  openModal(`<h3>Restore a snapshot</h3><div class="msub">Automatic snapshots kept on this device (newest first).</div>${list.length?`<div class="grid" style="gap:8px;max-height:340px;overflow:auto">${list.slice().reverse().map(b=>`<button class="btn btn-ghost between" style="justify-content:space-between" onclick="restoreBackup(${b.ts})"><span>${fmtDateTime(b.ts)}</span><span class="muted" style="font-size:12px">${(b.data.sessions||[]).length} sessions</span></button>`).join('')}</div>`:`<div class="empty"><div class="e-emj">🗂️</div><p>No snapshots yet. They accrue automatically as you use the app.</p></div>`}<div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Close</button></div>`); }
async function restoreBackup(ts){ const list=await Storage.listBackups(); const b=list.find(x=>x.ts===ts); if(!b){ toast('Snapshot not found'); return; } state=migrate(b.data); _lastSnap=null; save({history:false}); closeModal(); applyPrefs(); go('dashboard'); toast('Snapshot restored',fmtDateTime(ts),'↺'); }
function confirmReset(){ openModal(`<h3>Reset everything?</h3><div class="msub">All sessions, journal, reflections, goals and settings will be permanently deleted.</div><label class="field"><span>Type RESET to confirm</span><input id="rc" placeholder="RESET"></label><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-danger" onclick="doReset()">Delete All Data</button></div>`); }
async function doReset(){ if(($('#rc').value||'').trim().toUpperCase()!=='RESET'){ toast('Type RESET to confirm','','⚠️'); return; } await Storage.clearAll(); state=freshState(); _history=[];_future=[];_lastSnap=null; save({history:false}); closeModal(); applyPrefs(); go('dashboard'); toast('Fresh start','Your journey begins anew','🌱'); }

/* ============================== ROUTER / NAV ======================== */
const RENDERERS={dashboard:renderDashboard,session:renderSession,journey:renderJourney,library:renderLibrary,journal:renderJournal,analytics:renderAnalytics,achievements:renderAchievements,goals:renderGoals,reflection:renderReflection,calendar:renderCalendar,vision:renderVision,settings:renderSettings};
let currentView='dashboard';
function go(id){ if(!RENDERERS[id])id='dashboard'; currentView=id;
  $$('.view').forEach(v=>v.classList.remove('active')); $('#view-'+id).classList.add('active');
  $$('.nav-item').forEach(n=>{ const on=n.dataset.id===id; n.classList.toggle('active',on); on?n.setAttribute('aria-current','page'):n.removeAttribute('aria-current'); });
  const m=NAV.find(n=>n.id===id); $('#pageTitle').textContent=m.label; $('#pageSub').textContent=m.sub;
  RENDERERS[id](); window.scrollTo({top:0,behavior:'smooth'}); toggleNav(false);
}
function rerender(){ if(RENDERERS[currentView])RENDERERS[currentView](); rerenderChrome(); }
function rerenderChrome(){ try{ const g=computeGame(computeStats()); const n=$('#lvlNum'),r=$('#lvlRank'),x=$('#lvlXp'); if(n)n.textContent=g.level; if(r)r.textContent=g.rank.name; if(x)x.style.width=g.pctToNext+'%'; }catch(e){}
  $('#miniTimer')?.classList.toggle('on',timer.running); }
function buildNav(){ const nav=$('#nav'); nav.innerHTML=''; NAV.forEach(n=>{ const b=el(`<button class="nav-item" data-id="${n.id}"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${n.icon}</svg><span>${n.label}</span></button>`); b.onclick=()=>go(n.id); nav.appendChild(b); }); }
function toggleNav(open){ const sb=$('#sidebar'),bd=$('#backdrop'); if(open===undefined)open=!sb.classList.contains('open'); sb.classList.toggle('open',open); bd.classList.toggle('on',open); }
function menuToggle(){ if(innerWidth<=860)toggleNav(); else document.body.classList.toggle('nav-collapsed'); }

/* ============================== PREFERENCES ======================== */
function applyPrefs(){ const s=state.settings; setTheme(s.theme||'dark'); document.documentElement.setAttribute('data-accent',s.accent||'gold');
  document.body.classList.toggle('perf',!!s.performance); document.body.classList.toggle('motion-reduced',s.motion==='reduced'); document.body.classList.toggle('motion-off',s.motion==='off'); rerenderChrome(); }
function setTheme(t){ document.documentElement.setAttribute('data-theme',t); const i=$('#themeIcon'); if(i)i.innerHTML=t==='dark'?'<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>':'<circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'; const meta=document.querySelector('meta[name=theme-color]'); if(meta)meta.setAttribute('content',t==='dark'?'#0b0b16':'#eae4f3'); }
function toggleTheme(){ state.settings.theme=(document.documentElement.getAttribute('data-theme')==='dark')?'light':'dark'; save(); applyPrefs(); }

/* ============================== CLOCKS / KEYS ====================== */
function startClocks(){ setInterval(()=>{ if(currentView==='dashboard')updateCountdown(); },1000); }
function bindKeys(){ addEventListener('keydown',e=>{
  const mod=e.metaKey||e.ctrlKey;
  if(mod && e.key.toLowerCase()==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if(mod && e.key.toLowerCase()==='y'){ e.preventDefault(); redo(); return; }
  if(e.target.matches('input,textarea,[contenteditable="true"],select'))return;
  const k=e.key.toLowerCase();
  if(k==='escape'){ if($('#focus').classList.contains('on'))closeFocus(); else closeModal(); return; }
  if(k===' '){ if(currentView==='session'||$('#focus').classList.contains('on')){ e.preventDefault(); timer.running?(timer.paused?resumeTimer():pauseTimer()):startTimer(); } return; }
  if(k==='p')go('session'); else if(k==='f'){ go('session'); openFocus(); }
  else if(k==='d')go('dashboard'); else if(k==='l')go('library'); else if(k==='j')go('journal'); else if(k==='a')go('analytics');
  else if(k==='t')toggleTheme();
  else if(k>='1'&&k<='9'){ const n=NAV[+k-1]; if(n)go(n.id); }
});
  let sx=0; addEventListener('touchstart',e=>{ sx=e.touches[0].clientX; },{passive:true});
  addEventListener('touchend',e=>{ const dx=e.changedTouches[0].clientX-sx; if(sx<40&&dx>70)toggleNav(true); if(dx<-70&&$('#sidebar').classList.contains('open'))toggleNav(false); },{passive:true});
}
function bindUnload(){ const flush=()=>Storage.flush(state);
  addEventListener('pagehide',flush); addEventListener('beforeunload',flush);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'){ Storage.flush(state); Storage.persist(state); } });
}
function makeStars(){ let h=''; for(let i=0;i<70;i++)h+=`<i style="left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*4}s;animation-duration:${3+Math.random()*4}s"></i>`; $('#stars').innerHTML=h; }

/* ============================== BOOT ================================ */
async function boot(){
  makeStars();
  try{ await Storage.init(); }catch(e){}
  let loaded=null; try{ loaded=await Storage.load(); }catch(e){}
  state = loaded ? migrate(loaded) : freshState();
  _lastSnap=JSON.stringify(state);
  try{ _lastLevel=computeGame(computeStats()).level; }catch(e){ _lastLevel=1; }
  buildNav(); applyPrefs(); onChange(rerenderChrome);
  go('dashboard'); rerenderChrome();
  startClocks(); bindKeys(); bindUnload();
  // immediately mirror once so a fresh install is durable even before first edit
  Storage.persist(state);
  setTimeout(()=>{ $('#loader').classList.add('hide'); $('#app').classList.add('ready'); },1200);
}
if(document.readyState==='loading') addEventListener('DOMContentLoaded',boot); else boot();
addEventListener('resize',()=>{ if(currentView==='analytics')renderAnalytics(); });
// ===END===
</script>
